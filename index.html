<!doctype html>
<!--
  СТАРТОВАЯ РАЗМЕТКА ИГРЫ (площадка — Playgama, через Bridge).

  Копировать в новую игру целиком и менять только помеченные места:
  название, цвета и фигуру на экране загрузки. Всё остальное здесь стоит
  не «по вкусу», а по конкретным граблям — каждая помечена комментарием
  и пунктом правил площадки.

  Движок не важен: файл одинаково годится и для Phaser, и для Three.js.
  Разница только в том, что игра положит в `#game`, — холст 2D или WebGL.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    `viewport-fit=cover` — обязателен: без него safe-area на телефонах
    с вырезом отдаёт нули, и раскладка считает края экрана не там, где они
    есть. `maximum-scale=1` и `user-scalable=no` убирают двойной тап,
    который иначе зумит игру вместо хода.
  -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Spin the Chaos!</title>
  <link rel="preload" href="assets/fonts/nunito-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32">

  <!--
    Playgama Bridge — первым скриптом, синхронно, с официального CDN (рекомендация Playgama).
    Рядом с index.html лежит playgama-bridge-config.json (public/). Вне Playgama (локально, GitHub Pages)
    Bridge сам работает в режиме заглушки: хранилище — локальное, рекламы нет.
  -->
  <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>

  <style>
    /* Шрифт свой, из assets (Nunito Black — выбор заказчика 20.11): до этого шрифт вообще не подключался, и браузер рисовал запасной Arial Black
       («шрифт ужасный» — заказчик). Вариативный файл: и 700, и 900 в одном. Только кириллица и латиница. */
    @font-face { font-family: Nunito; font-style: normal; font-weight: 200 1000; font-display: swap;
      src: url(assets/fonts/nunito-cyr.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: Nunito; font-style: normal; font-weight: 200 1000; font-display: swap;
      src: url(assets/fonts/nunito-lat.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    html, body {
      margin: 0;
      padding: 0;
      /* fixed + dvh — из-за адресной строки.
         У обычных 100% высота считается по БОЛЬШОМУ вьюпорту, то есть по
         экрану без адресной строки. Пока строка видна, низ холста физически
         находится под ней — так на телефоне срезало нижний ряд интерфейса.
         100dvh — динамическая высота, всегда равная видимой области.
         Строка со 100% оставлена запасным вариантом для браузеров постарше. */
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #4aa8f0;          /* ЦВЕТ ФОНА ИГРЫ — небо */
      /* Блокируем swipe-to-refresh и прокрутку (п. 1.10.2).
         `touch-action: none` на html/body — сознательно, хотя в общем случае
         так делать не стоит: он душит прокрутку на iOS. Если весь интерфейс
         нарисован на холсте, прокручивать нечего, а жест «потянуть вниз для
         обновления» посреди партии — прямое нарушение. Если в игре ЕСТЬ
         прокручиваемые DOM-экраны, эту строку надо убрать. */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    #game { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #game canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

    /*
      ЭКРАН ЗАГРУЗКИ — РАЗМЕТКОЙ, А НЕ СЦЕНОЙ.

      Он обязан появиться раньше движка. Игра ждёт SDK (язык нужен до первого
      кадра, п. 2.14), потом поднимает движок, потом грузит ассеты — и всё это
      время рисовать нечем. На телефоне отсюда и берётся пустой фон
      на несколько секунд. Разметка же рисуется браузером сразу, ещё до
      единой строчки JS.

      Управляется из `yg-core`: splashProgress / splashCaption / splashHide.
    */
    /* Экран загрузки в стиле игры: небо, кубики падают и строят башню,
       на верх прыгает голова-роблоксовец. Всё разметкой — картинок не ждём. */
    #splash {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: min(3.2vmin, 3vh); overflow: hidden; padding: 2vh 0; box-sizing: border-box;
      background: linear-gradient(#4aa8f0, #9fd6ff 70%, #d8f0ff);
      transition: opacity .32s ease;
      font-family: Nunito, "Arial Black", system-ui, sans-serif;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    /* облака — позади надписей (раньше проплывали поверх «Загружаем…») */
    #splash > :not(.sp-cloud) { position: relative; z-index: 1; }
    .sp-cloud { position: absolute; z-index: 0; background: #fff; border-radius: 1.4vmin; opacity: .9;
      box-shadow: 0 1vmin 0 rgba(120,170,220,.35); animation: drift 14s linear infinite; }
    .sp-cloud.c1 { width: 22vmin; height: 7vmin; top: 12%; left: -25vmin; }
    .sp-cloud.c2 { width: 15vmin; height: 5vmin; top: 70%; left: -25vmin; animation-duration: 19s; animation-delay: -9s; }
    .sp-cloud.c3 { width: 28vmin; height: 8vmin; top: 30%; left: -30vmin; animation-duration: 24s; animation-delay: -16s; }
    @keyframes drift { to { transform: translateX(140vw); } }

    /* Кубики падают В РЯД (были стопкой — в альбомном телефоне экран загрузки не влезал по высоте, заказчик),
       голова-роблоксовец прыгает на средний. Размер — от --c, всё остальное от него. */
    #splash-mark { --c: min(10vmin, 64px); position: relative; width: calc(var(--c) * 3.4); height: calc(var(--c) * 1.85); flex: none; }
    .sp-cube { position: absolute; bottom: 0; width: var(--c); height: var(--c); box-sizing: border-box;
      border-radius: 14%; border: calc(var(--c) * .07) solid rgba(0,0,0,.25);
      box-shadow: inset 0 calc(var(--c) * -.12) 0 rgba(0,0,0,.18), inset 0 calc(var(--c) * .08) 0 rgba(255,255,255,.35);
      animation: drop 2.4s cubic-bezier(.5,0,.6,1.4) infinite both; }
    .sp-cube.k1 { left: 0; background: #4fc65a; animation-delay: 0s; }
    .sp-cube.k2 { left: calc(var(--c) * 1.2); background: #3d8cf0; animation-delay: .25s; }
    .sp-cube.k3 { left: calc(var(--c) * 2.4); background: #ff8a2a; animation-delay: .5s; }
    @keyframes drop {
      0% { transform: translateY(-60vh) rotate(-25deg); opacity: 0; }
      12% { opacity: 1; }
      30%, 85% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(0) scale(.6); opacity: 0; }
    }
    /* голова: жёлтый скруглённый цилиндр с глазами-точками и улыбкой */
    .sp-head { position: absolute; left: calc(var(--c) * 1.3); bottom: calc(var(--c) * .98); width: calc(var(--c) * .8); height: calc(var(--c) * .7);
      box-sizing: border-box; background: #ffd23a; border-radius: 30% / 40%; border: calc(var(--c) * .07) solid #c79a12;
      box-shadow: inset 0 calc(var(--c) * -.09) 0 rgba(0,0,0,.12);
      animation: hop 2.4s ease-in-out infinite both; }
    .sp-head::before { content: ""; position: absolute; left: 24%; top: 28%; width: 13%; height: 24%;
      background: #222; border-radius: 50%; box-shadow: calc(var(--c) * .3) 0 0 #222; }
    .sp-head::after { content: ""; position: absolute; left: 28%; top: 58%; width: 40%; height: 18%;
      border: calc(var(--c) * .05) solid #222; border-top: 0; border-radius: 0 0 50% 50%; }
    @keyframes hop {
      0%, 40% { transform: translateY(-60vh); opacity: 0; }
      55% { transform: translateY(0); opacity: 1; }
      62% { transform: translateY(calc(var(--c) * -.3)); }
      70%, 85% { transform: translateY(0); opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .sp-cube, .sp-head, .sp-cloud { animation: none; } }

    #splash-title { color: #fff; font-weight: 900; text-align: center; line-height: .95;
      font-size: clamp(30px, 10vmin, 72px); transform: rotate(-2deg);
      text-shadow: 0 .8vmin 0 #1b3a7a, 0 0 .6vmin #1b3a7a; }
    #splash-title small { display: block; font-size: .45em; color: #ffd23a;
      text-shadow: 0 .5vmin 0 #b0520a, 0 0 .5vmin #b0520a; }

    /* логотип не выше трети экрана: в альбомном телефоне иначе всё не влезало */
    #splash-logo { width: min(80vmin, 520px); max-height: 36vh; object-fit: contain; height: auto; flex: none;
      filter: drop-shadow(0 1vmin 1.4vmin rgba(0,0,0,.3)); }
    /* полоса — «стройка» из блоков: блоки поверх непрерывной заливки */
    #splash-bar { width: 60vmin; max-width: 380px; height: 4.4vmin; min-height: 20px; max-height: 30px;
      border-radius: 1.4vmin; background: rgba(20,50,110,.35); border: .6vmin solid #fff;
      box-shadow: 0 .7vmin 0 #1b3a7a; overflow: hidden; }
    #splash-fill { width: 0; height: 100%; transition: width .2s ease;
      background: repeating-linear-gradient(90deg, #ffd23a 0 calc(10% - 3px), #e8a80c calc(10% - 3px) 10%);
      background-size: 60vmin 100%; box-shadow: inset 0 -.8vmin 0 rgba(0,0,0,.15); }
    /* подпись — на тёмной плашке: белый текст на светлом низу неба читался плохо (заказчик) */
    #splash-text { font-weight: 900; font-size: clamp(15px, 3.6vmin, 24px); color: #fff; line-height: 1.2;
      padding: .25em .9em; border-radius: 999px; background: rgba(20,45,110,.72);
      box-shadow: 0 .5vmin 0 rgba(10,25,70,.45); text-shadow: 0 2px 0 #0d2152; }
    #splash-text:empty { visibility: hidden; }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="splash">
    <div class="sp-cloud c1"></div><div class="sp-cloud c2"></div><div class="sp-cloud c3"></div>
    <div id="splash-mark"><div class="sp-cube k1"></div><div class="sp-cube k2"></div><div class="sp-cube k3"></div><div class="sp-head"></div></div>
    <div id="splash-title" style="visibility:hidden">КРУТИ<small>ХАОС!</small></div>
    <img id="splash-logo" alt="" hidden>
    <div id="splash-bar"><div id="splash-fill"></div></div>
    <div id="splash-text"></div>
  </div>

  <script>
    /*
      Жесты браузера, которые ломают игру, гасятся ДО загрузки движка.

      Контекстное меню по долгому нажатию, выделение текста протяжкой и
      прокрутка страницы пальцем — всё это на холсте выглядит как сбой
      управления. Ставится здесь, а не в игре: до появления движка проходит
      секунда-другая, и попасть в неё пальцем вполне можно.
    */
    // Название на загрузке — на языке ПЛОЩАДКИ (Playgama 3.4.2: язык только из Bridge). Пока Bridge не ответил,
    // видны только кубики; main.ts зовёт splashLang(ru) сразу после bridge.initialize().
    // Рисованный логотип своего языка; текст — запасной, если картинка не загрузилась.
    window.splashLang = function (ru) {
      var title = document.getElementById('splash-title'), logo = document.getElementById('splash-logo');
      if (!ru) title.innerHTML = 'SPIN THE<small>CHAOS!</small>';
      document.documentElement.lang = ru ? 'ru' : 'en';
      document.title = ru ? 'Крути хаос!' : 'Spin the Chaos!';
      title.style.visibility = 'visible';
      logo.onload = function () { title.hidden = true; logo.hidden = false; };
      logo.src = 'assets/ui/' + (ru ? 'logo' : 'logo_en') + '.webp';
    };
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  </script>

  <!-- ТОЧКА ВХОДА ИГРЫ -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

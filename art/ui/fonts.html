<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Шрифты</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Unbounded:wght@900&family=Russo+One&family=Seymour+One&family=Nunito:wght@900&family=Rubik+Mono+One&family=Montserrat+Alternates:wght@900&family=Days+One&family=Balsamiq+Sans:wght@700&family=Oi&display=block" rel="stylesheet">
<style>
body{margin:0;padding:16px;background:linear-gradient(#4aa8f0,#9fd6ff);font-family:system-ui;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.c{background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.n{font:700 14px system-ui;color:#123}
.logo{font-size:44px;line-height:1;color:#fff;-webkit-text-stroke:6px #1b2a55;paint-order:stroke fill;text-shadow:0 5px 0 #1b2a55}
.logo b{color:#ffd23a;font-weight:inherit}
.row{display:flex;gap:10px;align-items:center}
.btn{font-size:26px;color:#5a2a00;background:linear-gradient(#ffe56c,#f5ad22);border:4px solid #fff;border-radius:14px;padding:8px 22px;box-shadow:0 5px 0 #a9680e}
.t{font-size:22px;color:#fff;background:#1d3f86;border:3px solid #fff;border-radius:12px;padding:4px 12px}
.s{font-size:18px;color:#fff;-webkit-text-stroke:4px #1b2a55;paint-order:stroke fill}
</style></head><body>
<script>
const F=[['1. Dela Gothic One','Dela Gothic One',400],['2. Unbounded','Unbounded',900],['3. Russo One','Russo One',400],['4. Seymour One','Seymour One',400],['5. Nunito Black','Nunito',900],['6. Rubik Mono One','Rubik Mono One',400],['7. Montserrat Alternates','Montserrat Alternates',900],['8. Days One','Days One',400],['9. Balsamiq Sans','Balsamiq Sans',700],['10. Oi','Oi',400]];
for(const [n,f,w] of F){document.body.insertAdjacentHTML('beforeend',`<div class="c" style="font-family:'${f}';font-weight:${w}"><div class="n">${n}</div><div class="logo">КРУТИ <b>ХАОС!</b></div><div class="row"><span class="btn">ИГРАТЬ</span><span class="t">⏱ 0:45</span></div><div class="s">5 ОГНЕННЫХ КОТОВ! · Spin the Chaos!</div></div>`)}
</script></body></html>
